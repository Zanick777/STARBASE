      <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#c9ccd3"/><stop offset=".52" stop-color="#8d929c"/><stop offset=".72" stop-color="#e8e2d2"/><stop offset="1" stop-color="#d8c08a"/>
    </linearGradient>
    <radialGradient id="blue" cx=".85" cy="0" r=".7"><stop offset="0" stop-color="#3e6ae1" stop-opacity=".35"/><stop offset="1" stop-color="#3e6ae1" stop-opacity="0"/></radialGradient>
    <radialGradient id="red" cx=".1" cy="1.1" r=".6"><stop offset="0" stop-color="#ff4b3a" stop-opacity=".25"/><stop offset="1" stop-color="#ff4b3a" stop-opacity="0"/></radialGradient>
